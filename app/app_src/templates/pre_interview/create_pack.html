{% extends "base.html" %}

{% block content %}

<section class="hero rr-primary">
  <div class="hero-body">
    <div class="container">
      <h1 class="title rr-white">Create Application Pack</h1>
      <p class="rr-white">
        Add a new evaluation track to the dashboard
      </p>
    </div>
  </div>
</section>

<section class="section">
  <div class="container" style="max-width: 600px;">

    <div class="box p-5" style="background-color: #838282; border-left: 5px solid #1800A8; border-radius: 8px;">

      <form method="POST">
        {% csrf_token %}

        {% for field in form %}
          <div class="field mb-4">
            <label class="label rr-white" style="text-align: left;">{{ field.label }}</label>
            <div class="control">
              {{ field }}
            </div>
          </div>
        {% endfor %}

        <div class="is-flex is-justify-content-space-between mt-5 pt-2">
          <a href="{% url 'applications' %}" class="button is-light">
            Cancel
          </a>
          <button type="submit" class="button rr-primary px-5">
            <strong>Save Pack</strong>
          </button>
        </div>

      </form>

    </div>

  </div>
</section>

{% endblock %}
