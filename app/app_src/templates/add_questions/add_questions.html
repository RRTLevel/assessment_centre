<!DOCTYPE html>

<html>
<head> 
    <title>Add Questions</title>   

    {% load static %}

    <meta charset="utf-8">

    <link rel="stylesheet" href="{% static 'bulma/css/style.min.css' %}">
    <script src="{% static 'admin/js/vendor/jquery/jquery.min.js' %}"></script>

    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'images/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'images/favicon-16x16.png' %}">

    <link rel="stylesheet" href="{% static 'css/styles.css' %}">

</head>

<body>

   <!-- {% include 'includes/non_production_banner.html' %} -->

    <header>
        {% include 'includes/title.html' %}
        {% include 'includes/nav.html' %}
    </header>

    <main class="section">

        <div >

            {% block content %}

            <div class = "interview-header">
                <h1 class="title interview-title">Add Question 
                </h1>
            </div>

        
            <div class = "interview-title">
                <label for="enter-question">Enter your Question:

                </label><br>
            </div>


            <div>
                <textarea id="enter-question" name="enter-question">

                </textarea>

                <style>
                textarea {
                    width: 50%;
                    height: 100px;
                    padding: 10px;
                    font-size: 16px;
                    resize: vertical; 
                    color: #10069f;
                    border-color: #10069f;
                    border-width: 2px;
                    border-radius: 5px;
                }
                </style><br>

            </div>




            <div>
                <h1> </h1>
            </div>

            <style>
                .dropdown {
                width: 100px;
                padding: 0px;
                font-size: 16px;
                border: 2px solid #10069f;
                border-radius: 4px;
                background-color: rgba(255, 255, 255, 0.363);
                color: #333;
                cursor: pointer;
                outline: none;
                transition: 0.3s ease;
                border-width: 1px;
                }
            </style>

            <div class = "dropdown" >
                <select id="packs" name="packs">
                <option value="" selected disabled>Select a pack</option>
                <option value="Pack 1">Pack 1</option>
                <option value="Pack 2">Pack 2</option>
                <option value="Pack 3">Pack 3</option>
                </select> 

            </div><br><br>

            <div class="add-question-btn">
                <button class = "submit-btn">
                    Submit
                </button>
            </div>

            {% endblock %}

        </div>

    </main>

    {% include 'includes/footer.html' %}

</body>

</html>
