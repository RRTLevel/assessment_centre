{% extends "base.html" %}

{% block content %}

<main class="section">
    <div class="container interview-container">

        <div class="interview-header">
            <h1 class="title interview-title">
                Add Question
            </h1>
        </div>

        <form method="post">
            {% csrf_token %}

            <div class="field">
                {{ form.question.label_tag }}

                <div class="control">
                    {{ form.question }}
                </div>
            </div>

            <div class="field">
                <div class="control">
                    <div class="select">
                        {{ form.pack }}
                    </div>
                </div>
            </div>

            <div class="submit-section">
                <button type="submit" class="submit-btn">
                    Submit
                </button>
            </div>
        </form>

    </div>
</main>

{% endblock %}
